services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: volunteer_coordinator
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for local development}
    ports:
      - "${POSTGRES_PORT:-54329}:5432"
    volumes:
      - volunteer-coordinator-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d volunteer_coordinator"]
      interval: 5s
      timeout: 5s
      retries: 12
  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=volunteer_coordinator;Username=postgres;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD for local development}
      Database__MigrateOnStartup: "true"
      DevelopmentAuth__Enabled: "true"
      Coordinator__AllowedEmails__0: ${COORDINATOR_EMAIL:?Set COORDINATOR_EMAIL for local development}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"

volumes:
  volunteer-coordinator-postgres:
